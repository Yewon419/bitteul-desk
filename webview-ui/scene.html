<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1a2a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="빛뜰 데스크" />
    <link rel="apple-touch-icon" href="./scene/app-icon.png" />
    <link rel="icon" type="image/png" href="./scene/app-icon.png" />
    <title>빛뜰 데스크</title>
    <style>
      @font-face {
        font-family: 'Galmuri11';
        src: url('./fonts/galmuri/Galmuri11.woff2') format('woff2');
        font-weight: normal;
      }
      @font-face {
        font-family: 'Galmuri11';
        src: url('./fonts/galmuri/Galmuri11-Bold.woff2') format('woff2');
        font-weight: bold;
      }
      @font-face {
        font-family: 'Galmuri9';
        src: url('./fonts/galmuri/Galmuri9.woff2') format('woff2');
      }
      #toolbar { position: sticky; top: 0; z-index: 9; align-self: stretch; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 8px; padding: calc(12px + env(safe-area-inset-top)) 14px 12px; background: #0f1a2a; }
      #toolbar:not(:has(.tool-btn:not([hidden]))) { display: none; }
      .tool-btn { font-family: 'Galmuri11', sans-serif; font-size: 14px; padding: 8px 14px; background: #ffd166; color: #13293d; border: 3px solid #13293d; box-shadow: 3px 3px 0 #13293d; cursor: pointer; }
      .tool-btn[hidden] { display: none; }
      #scope { background: #ffffff; }
      #scope[data-on='true'] { background: #bfe0f5; }
      #pair { background: #bfe0f5; }
      #pair-modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(8, 14, 24, 0.72); }
      #pair-modal[hidden] { display: none; }
      .pair-card { width: min(380px, 100%); box-sizing: border-box; padding: 20px; text-align: center; font-family: 'Galmuri11', sans-serif; color: #13293d; background: #ffffff; border: 3px solid #13293d; box-shadow: 4px 4px 0 #13293d; }
      .pair-card h2 { margin: 0 0 12px; font-size: 18px; }
      #pair-qr { display: block; width: 240px; height: 240px; margin: 0 auto 12px; image-rendering: pixelated; }
      #pair-qr[hidden] { display: none; }
      .pair-card p { margin: 0 0 10px; font-size: 13px; line-height: 1.6; }
      #pair-where { color: #2b5d85; }
      #board-modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: flex-start; justify-content: center; padding: 16px; background: rgba(8, 14, 24, 0.72); overflow-y: auto; }
      #board-modal[hidden] { display: none; }
      .board-card { margin: auto; display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; justify-content: center; width: min(640px, 100%); box-sizing: border-box; padding: 20px; font-family: 'Galmuri11', sans-serif; color: #13293d; background: #ffffff; border: 3px solid #13293d; box-shadow: 4px 4px 0 #13293d; }
      .board-card h2 { flex-basis: 100%; margin: 0; font-size: 18px; text-align: center; }
      #board-preview { image-rendering: pixelated; border: 3px solid #13293d; background: #0f1a2a; }
      #board-form { display: flex; flex-direction: column; gap: 10px; flex: 1 1 240px; min-width: 0; }
      #board-form label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
      #board-form input { box-sizing: border-box; width: 100%; font: inherit; font-size: 16px; padding: 6px 8px; color: #13293d; background: #f1f6fb; border: 2px solid #13293d; border-radius: 0; }
      .board-hint { margin: 0; font-size: 12px; line-height: 1.5; color: #2b5d85; }
      #board-error { margin: 0; font-size: 12px; color: #b3261e; }
      #board-error:empty { display: none; }
      .board-actions { display: flex; gap: 8px; }
      #board-readonly { flex-basis: 100%; margin: 0; font-size: 13px; text-align: center; }
      #board-readonly[hidden], #board-form[hidden] { display: none; }
      #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 12; max-width: min(640px, 92vw); padding: 12px 16px; font-family: 'Galmuri11', sans-serif; font-size: 14px; line-height: 1.6; color: #ffffff; background: #13293d; border: 3px solid #ffd166; }
      #toast[hidden] { display: none; }
      #toast a { color: #ffd166; font-weight: bold; }
      #toast button { font: inherit; font-size: 12px; margin-left: 6px; padding: 2px 8px; color: #13293d; background: #bfe0f5; border: 0; cursor: pointer; }
      html, body { margin: 0; }
      body { min-height: 100vh; overflow-x: hidden; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
      .sign-input { position: absolute; z-index: 11; box-sizing: border-box; font-family: 'Galmuri11', sans-serif; font-size: 16px; font-weight: bold; text-align: center; color: #13293d; background: #ffffff; border: 3px solid #ffd166; outline: none; }
      canvas { image-rendering: pixelated; display: block; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="hire" class="tool-btn" type="button" hidden>+ 새 직원</button>
      <button id="pair" class="tool-btn" type="button" hidden>폰 연결</button>
      <button id="scope" class="tool-btn" type="button" hidden title="다른 폴더에서 연 Claude Code 세션도 사무실에 불러올지 정해요">이 폴더만 보는 중</button>
    </div>
    <canvas id="scene"></canvas>
    <div id="toast" role="status" hidden></div>
    <div id="board-modal" role="dialog" aria-modal="true" aria-labelledby="board-heading" hidden>
      <div class="board-card">
        <h2 id="board-heading">벽 게시판</h2>
        <canvas id="board-preview" aria-label="벽 게시판 미리보기"></canvas>
        <form id="board-form" hidden>
          <label>제목 <input name="boardTitle" maxlength="20" placeholder="빛뜰 데스크" /></label>
          <label>D-day 이름 <input name="countdownLabel" maxlength="20" placeholder="마감까지" /></label>
          <label>D-day 날짜 <input name="countdownDate" type="date" /></label>
          <label>이번 달 월급 <input name="salaryThisMonth" type="number" min="0" step="1000" inputmode="numeric" /></label>
          <label>목표 월급 <input name="salaryTarget" type="number" min="0" step="1000" inputmode="numeric" /></label>
          <p class="board-hint">날짜를 비우면 D-day가, 목표 월급을 비우면 월급 게이지가 게시판에서 빠져요.</p>
          <p id="board-error"></p>
          <div class="board-actions">
            <button type="submit" class="tool-btn">저장</button>
            <button type="button" id="board-close" class="tool-btn">닫기</button>
          </div>
        </form>
        <p id="board-readonly" hidden>보기 전용 화면이라 고칠 수 없어요. 토큰이 들어간 주소로 열면 고칠 수 있어요.</p>
      </div>
    </div>
    <div id="pair-modal" role="dialog" aria-modal="true" aria-labelledby="pair-title" hidden>
      <div class="pair-card">
        <h2 id="pair-title">폰 연결</h2>
        <img id="pair-qr" alt="폰에서 사무실을 여는 QR 코드" hidden />
        <p id="pair-text"></p>
        <p id="pair-where"></p>
        <button id="pair-close" class="tool-btn" type="button">닫기</button>
      </div>
    </div>
    <script type="module" src="/src/scene/main.ts"></script>
  </body>
</html>
