<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3b4c65" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="빛뜰 데스크" />
    <link rel="apple-touch-icon" href="./scene/app-icon.png" />
    <link rel="icon" type="image/png" href="./scene/app-icon.png" />
    <title>빛뜰 데스크</title>
    <style>
      @font-face {
        font-family: 'Galmuri11';
        src: url('./fonts/galmuri/Galmuri11.woff2') format('woff2');
        font-weight: normal;
      }
      @font-face {
        font-family: 'Galmuri11';
        src: url('./fonts/galmuri/Galmuri11-Bold.woff2') format('woff2');
        font-weight: bold;
      }
      @font-face {
        font-family: 'Galmuri9';
        src: url('./fonts/galmuri/Galmuri9.woff2') format('woff2');
      }
      @font-face {
        font-family: 'Pretendard Variable';
        src: url('./fonts/pretendard/PretendardVariable.woff2') format('woff2-variations');
        font-weight: 45 920;
        font-display: swap;
      }
      :root {
        --read:
          'Pretendard Variable', system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic',
          'Apple SD Gothic Neo', sans-serif;
      }
      /* Text-heavy panels read in Pretendard; the office itself stays pixel. */
      .pair-card .tool-btn,
      .board-card .tool-btn {
        font-family: var(--read);
      }
      #toolbar {
        position: sticky;
        top: 0;
        z-index: 9;
        align-self: stretch;
        box-sizing: border-box;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: calc(12px + env(safe-area-inset-top)) 14px 12px;
        background: #3b4c65;
      }
      #toolbar:not(:has(.tool-btn:not([hidden]))) {
        display: none;
      }
      .tool-btn {
        font-family: 'Galmuri11', sans-serif;
        font-size: 14px;
        padding: 8px 14px;
        background: #ffd166;
        color: #13293d;
        border: 3px solid #13293d;
        box-shadow: 3px 3px 0 #13293d;
        cursor: pointer;
      }
      .tool-btn[hidden] {
        display: none;
      }
      #scope {
        background: #ffffff;
      }
      #scope[data-on='true'] {
        background: #bfe0f5;
      }
      #pair {
        background: #bfe0f5;
      }
      #team {
        background: #c8ecd2;
      }
      #team-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 16px;
        background: rgba(8, 14, 24, 0.6);
        overflow-y: auto;
      }
      #team-modal[hidden] {
        display: none;
      }
      .team-card-box {
        --tm-ink: #13293d;
        --tm-dim: #5b7186;
        --tm-line: #d6e1eb;
        --tm-soft: #f3f7fb;
        --tm-accent: #2b86c5;
        --tm-danger: #c0392b;
        margin: auto;
        width: min(560px, 100%);
        box-sizing: border-box;
        padding: 22px 22px 18px;
        font-family: var(--read);
        color: var(--tm-ink);
        background: #ffffff;
        border: 1px solid var(--tm-line);
        border-radius: 14px;
        box-shadow: 0 18px 48px rgba(8, 14, 24, 0.35);
      }
      .tm-head {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .tm-head h2 {
        flex: 1;
        margin: 0;
        font-size: 19px;
        font-weight: 700;
      }
      .tm-icon-btn {
        display: inline-grid;
        place-items: center;
        width: 32px;
        height: 32px;
        padding: 0;
        font: inherit;
        font-size: 18px;
        line-height: 1;
        color: var(--tm-dim);
        background: transparent;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      .tm-icon-btn:hover {
        color: var(--tm-ink);
        background: var(--tm-soft);
      }
      .team-intro {
        margin: 6px 0 18px;
        font-size: 13px;
        line-height: 1.6;
        color: var(--tm-dim);
      }
      #team-form {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .tm-section {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .tm-section-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tm-section-head h3 {
        flex: 1;
        margin: 0;
        font-size: 14px;
        font-weight: 700;
      }
      .tm-count {
        margin-left: 4px;
        font-weight: 500;
        color: var(--tm-dim);
      }
      .tm-grid {
        display: grid;
        grid-template-columns: 1fr 140px;
        gap: 12px;
      }
      @media (max-width: 480px) {
        .tm-grid {
          grid-template-columns: 1fr;
        }
      }
      #team-form label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
        font-size: 13px;
        font-weight: 600;
        color: var(--tm-ink);
      }
      #team-form input,
      #team-form select,
      #team-form textarea {
        box-sizing: border-box;
        width: 100%;
        min-width: 0;
        padding: 9px 11px;
        font: inherit;
        font-size: 16px;
        font-weight: 400;
        color: var(--tm-ink);
        background: #ffffff;
        border: 1px solid var(--tm-line);
        border-radius: 8px;
      }
      #team-form input:focus,
      #team-form select:focus,
      #team-form textarea:focus {
        outline: none;
        border-color: var(--tm-accent);
        box-shadow: 0 0 0 3px rgba(43, 134, 197, 0.18);
      }
      #team-form textarea {
        resize: vertical;
        line-height: 1.5;
      }
      .team-template-row {
        display: flex;
        gap: 8px;
        align-items: flex-end;
      }
      .team-template-row label {
        flex: 1;
      }
      .team-hint {
        font-size: 12px;
        font-weight: 400;
        line-height: 1.5;
        color: var(--tm-dim);
      }
      .tm-text-btn {
        padding: 8px 10px;
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        color: var(--tm-accent);
        background: transparent;
        border: 0;
        border-radius: 8px;
        cursor: pointer;
        white-space: nowrap;
      }
      .tm-text-btn:hover {
        background: var(--tm-soft);
      }
      .tm-text-btn:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #team-template-delete {
        color: var(--tm-danger);
      }
      #team-template-delete[hidden] {
        display: none;
      }
      .tm-org {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 12px 10px 10px;
        background: var(--tm-soft);
        border-radius: 12px;
      }
      .tm-org-lead {
        display: flex;
        justify-content: center;
      }
      .tm-org-lead .tm-card {
        width: 92px;
      }
      .tm-org-lead .tm-face {
        width: 40px;
        height: 28px;
      }
      .tm-org-line {
        width: 2px;
        height: 10px;
        background: var(--tm-line);
      }
      #team-members {
        box-sizing: border-box;
        width: 100%;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
        gap: 8px;
        margin: 0;
        padding: 10px 0 0;
        list-style: none;
        border-top: 2px solid var(--tm-line);
      }
      .tm-card {
        position: relative;
        height: 100%;
      }
      .tm-person {
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1px;
        padding: 8px 4px 6px;
        font: inherit;
        text-align: center;
        color: inherit;
        background: #ffffff;
        border: 1px solid var(--tm-line);
        border-radius: 10px;
        cursor: pointer;
      }
      .tm-person:hover {
        border-color: #a9c3d9;
      }
      .tm-person[data-selected] {
        border-color: var(--tm-accent);
        box-shadow: 0 0 0 3px rgba(43, 134, 197, 0.18);
      }
      .tm-person[data-missing] {
        border-color: var(--tm-danger);
      }
      .tm-face {
        width: 32px;
        height: 22px;
        margin-bottom: 2px;
        object-fit: contain;
        image-rendering: pixelated;
      }
      .tm-person-name {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 12px;
        font-weight: 700;
      }
      .tm-person-lead {
        font-size: 10px;
        font-weight: 600;
        color: #9a7300;
      }
      .tm-person-model {
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 10px;
        color: var(--tm-dim);
      }
      .tm-help {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 16px;
        height: 16px;
        padding: 0;
        font: inherit;
        font-size: 10px;
        font-weight: 700;
        line-height: 14px;
        color: var(--tm-dim);
        background: #ffffff;
        border: 1px solid var(--tm-line);
        border-radius: 50%;
        cursor: pointer;
      }
      .tm-help:hover,
      .tm-help[aria-expanded='true'] {
        color: #ffffff;
        background: var(--tm-accent);
        border-color: var(--tm-accent);
      }
      .tm-card[data-missing] .tm-help {
        color: var(--tm-danger);
        border-color: var(--tm-danger);
      }
      .tm-bubble {
        position: absolute;
        z-index: 2;
        top: calc(100% + 6px);
        left: 50%;
        box-sizing: border-box;
        width: 200px;
        margin: 0;
        padding: 8px 10px;
        transform: translateX(-50%);
        font-size: 12px;
        line-height: 1.5;
        text-align: left;
        color: #ffffff;
        background: var(--tm-ink);
        border-radius: 8px;
        box-shadow: 0 6px 16px rgba(19, 41, 61, 0.2);
      }
      .tm-add {
        justify-content: center;
        min-height: 72px;
        font-size: 11px;
        font-weight: 600;
        color: var(--tm-accent);
        background: transparent;
        border: 1px dashed #a9c3d9;
      }
      .tm-add .tm-plus {
        font-size: 18px;
        line-height: 1;
      }
      .tm-add:disabled {
        opacity: 0.45;
        cursor: default;
      }
      #team-editor:empty {
        display: none;
      }
      .tm-editor {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 14px;
        border: 1px solid var(--tm-accent);
        border-radius: 12px;
      }
      .tm-editor-head {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tm-editor-head .tm-face {
        width: 40px;
        height: 28px;
        margin: 0;
      }
      .tm-editor-head h4 {
        flex: 1;
        margin: 0;
        font-size: 15px;
      }
      .tm-fields {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      @media (max-width: 480px) {
        .tm-fields {
          grid-template-columns: 1fr;
        }
        #team-members {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      .tm-row-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }
      .team-lead-note {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: var(--tm-dim);
      }
      .team-remove {
        color: var(--tm-danger);
      }
      #team-error {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: var(--tm-danger);
      }
      #team-error:empty {
        display: none;
      }
      #team-error[data-ok] {
        color: #1e6b3a;
      }
      .team-actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding-top: 16px;
        border-top: 1px solid var(--tm-line);
      }
      .tm-spacer {
        flex: 1;
      }
      .tm-btn {
        padding: 10px 16px;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        color: var(--tm-ink);
        background: #ffffff;
        border: 1px solid var(--tm-line);
        border-radius: 8px;
        cursor: pointer;
      }
      .tm-btn:hover {
        background: var(--tm-soft);
      }
      .tm-btn-primary {
        color: #ffffff;
        background: var(--tm-accent);
        border-color: var(--tm-accent);
      }
      .tm-btn-primary:hover {
        background: #2475ad;
      }
      #desk-hire {
        position: absolute;
        z-index: 8;
        transform: translate(-50%, -50%);
        white-space: nowrap;
      }
      #desk-hire[hidden] {
        display: none;
      }
      #pair-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        background: rgba(8, 14, 24, 0.72);
      }
      #pair-modal[hidden] {
        display: none;
      }
      .pair-card {
        width: min(380px, 100%);
        box-sizing: border-box;
        padding: 20px;
        text-align: center;
        font-family: var(--read);
        color: #13293d;
        background: #ffffff;
        border: 3px solid #13293d;
        box-shadow: 4px 4px 0 #13293d;
      }
      .pair-card h2 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      #pair-qr {
        display: block;
        width: 240px;
        height: 240px;
        margin: 0 auto 12px;
        image-rendering: pixelated;
      }
      #pair-qr[hidden] {
        display: none;
      }
      .pair-card p {
        margin: 0 0 10px;
        font-size: 13px;
        line-height: 1.6;
      }
      #pair-where {
        color: #2b5d85;
      }
      #board-modal {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 16px;
        background: rgba(8, 14, 24, 0.72);
        overflow-y: auto;
      }
      #board-modal[hidden] {
        display: none;
      }
      .board-card {
        margin: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        align-items: flex-start;
        justify-content: center;
        width: min(640px, 100%);
        box-sizing: border-box;
        padding: 20px;
        font-family: var(--read);
        color: #13293d;
        background: #ffffff;
        border: 3px solid #13293d;
        box-shadow: 4px 4px 0 #13293d;
      }
      .board-card h2 {
        flex-basis: 100%;
        margin: 0;
        font-size: 18px;
        text-align: center;
      }
      #board-preview {
        image-rendering: pixelated;
        border: 3px solid #13293d;
        background: #0f1a2a;
      }
      #board-form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        flex: 1 1 240px;
        min-width: 0;
      }
      #board-form label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
      }
      #board-form input {
        box-sizing: border-box;
        width: 100%;
        font: inherit;
        font-size: 16px;
        padding: 6px 8px;
        color: #13293d;
        background: #f1f6fb;
        border: 2px solid #13293d;
        border-radius: 0;
      }
      .board-hint {
        margin: 0;
        font-size: 12px;
        line-height: 1.5;
        color: #2b5d85;
      }
      #board-error {
        margin: 0;
        font-size: 12px;
        color: #b3261e;
      }
      #board-error:empty {
        display: none;
      }
      .board-actions {
        display: flex;
        gap: 8px;
      }
      #board-readonly {
        flex-basis: 100%;
        margin: 0;
        font-size: 13px;
        text-align: center;
      }
      #board-readonly[hidden],
      #board-form[hidden] {
        display: none;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 12;
        max-width: min(640px, 92vw);
        padding: 12px 16px;
        font-family: var(--read);
        font-size: 14px;
        line-height: 1.6;
        color: #ffffff;
        background: #13293d;
        border: 3px solid #ffd166;
      }
      #toast[hidden] {
        display: none;
      }
      #toast a {
        color: #ffd166;
        font-weight: bold;
      }
      #toast button {
        font: inherit;
        font-size: 12px;
        margin-left: 6px;
        padding: 2px 8px;
        color: #13293d;
        background: #bfe0f5;
        border: 0;
        cursor: pointer;
      }
      html,
      body {
        margin: 0;
      }
      body {
        min-height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .sign-input {
        position: absolute;
        z-index: 11;
        box-sizing: border-box;
        font-family: 'Galmuri11', sans-serif;
        font-size: 16px;
        font-weight: bold;
        text-align: center;
        color: #13293d;
        background: #ffffff;
        border: 3px solid #ffd166;
        outline: none;
      }
      #scene {
        position: sticky;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
        touch-action: pan-y;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="hire" class="tool-btn" type="button" hidden>+ 새 직원</button>
      <button id="team" class="tool-btn" type="button" hidden>+ 새 팀</button>
      <button id="pair" class="tool-btn" type="button" hidden>폰 연결</button>
      <button
        id="scope"
        class="tool-btn"
        type="button"
        hidden
        title="다른 폴더에서 연 Claude Code 세션도 사무실에 불러올지 정해요"
      >
        이 폴더만 보는 중
      </button>
    </div>
    <div id="stage"><canvas id="scene"></canvas></div>
    <div id="toast" role="status" hidden></div>
    <button id="desk-hire" class="tool-btn" type="button" hidden>+ 직원 추가</button>
    <div id="board-modal" role="dialog" aria-modal="true" aria-labelledby="board-heading" hidden>
      <div class="board-card">
        <h2 id="board-heading">벽 게시판</h2>
        <canvas id="board-preview" aria-label="벽 게시판 미리보기"></canvas>
        <form id="board-form" hidden>
          <label>제목 <input name="boardTitle" maxlength="20" placeholder="빛뜰 데스크" /></label>
          <label
            >D-day 이름 <input name="countdownLabel" maxlength="20" placeholder="마감까지"
          /></label>
          <label>D-day 날짜 <input name="countdownDate" type="date" /></label>
          <label
            >이번 달 월급
            <input name="salaryThisMonth" type="number" min="0" step="1000" inputmode="numeric"
          /></label>
          <label
            >목표 월급
            <input name="salaryTarget" type="number" min="0" step="1000" inputmode="numeric"
          /></label>
          <p class="board-hint">
            날짜를 비우면 D-day가, 목표 월급을 비우면 월급 게이지가 게시판에서 빠져요.
          </p>
          <p id="board-error"></p>
          <div class="board-actions">
            <button type="submit" class="tool-btn">저장</button>
            <button type="button" id="board-close" class="tool-btn">닫기</button>
          </div>
        </form>
        <p id="board-readonly" hidden>
          보기 전용 화면이라 고칠 수 없어요. 토큰이 들어간 주소로 열면 고칠 수 있어요.
        </p>
      </div>
    </div>
    <div id="team-modal" role="dialog" aria-modal="true" aria-labelledby="team-heading" hidden>
      <div class="team-card-box">
        <div class="tm-head">
          <h2 id="team-heading">새 팀 만들기</h2>
          <button type="button" id="team-close" class="tm-icon-btn" aria-label="닫기">✕</button>
        </div>
        <p class="team-intro">
          팀장이 대표님 지시를 받아 팀원에게 일을 나눠요. 팀원끼리도 직접 이야기하고, 허락이 필요한
          일은 팀장 대화 창으로 모여요.
        </p>
        <form id="team-form">
          <section class="tm-section">
            <div class="team-template-row">
              <label
                >시작할 구성
                <select id="team-template"></select
              ></label>
              <button type="button" id="team-template-delete" class="tm-text-btn" hidden>
                템플릿 삭제
              </button>
            </div>
            <label
              >팀 이름 <input id="team-name" maxlength="40" placeholder="예: 랜딩페이지 팀"
            /></label>
            <div class="tm-grid">
              <label
                >작업 폴더
                <input id="team-cwd" maxlength="1000" placeholder="비우면 빛뜰 데스크를 켠 폴더"
              /></label>
              <label
                >예산 (달러)
                <input
                  id="team-budget"
                  type="number"
                  inputmode="decimal"
                  min="0.1"
                  max="1000"
                  step="0.1"
                  placeholder="한도 없음"
              /></label>
            </div>
            <span class="team-hint">예산만큼 쓰면 팀이 멈춰요. 80%를 넘기면 대화 창에 알려요.</span>
          </section>
          <section class="tm-section">
            <div class="tm-section-head">
              <h3>팀 구성<span class="tm-count" id="team-count"></span></h3>
              <span class="team-hint">카드를 누르면 고칠 수 있어요</span>
            </div>
            <div class="tm-org">
              <div id="team-lead" class="tm-org-lead"></div>
              <div class="tm-org-line"></div>
              <ul id="team-members"></ul>
            </div>
            <div id="team-editor"></div>
          </section>
          <p id="team-error" role="status"></p>
          <div class="team-actions">
            <button type="button" id="team-save" class="tm-text-btn">템플릿으로 저장</button>
            <span class="tm-spacer"></span>
            <button type="button" id="team-cancel" class="tm-btn">취소</button>
            <button type="submit" class="tm-btn tm-btn-primary">팀 만들기</button>
          </div>
        </form>
      </div>
    </div>
    <div id="pair-modal" role="dialog" aria-modal="true" aria-labelledby="pair-title" hidden>
      <div class="pair-card">
        <h2 id="pair-title">폰 연결</h2>
        <img id="pair-qr" alt="폰에서 사무실을 여는 QR 코드" hidden />
        <p id="pair-text"></p>
        <p id="pair-where"></p>
        <button id="pair-close" class="tool-btn" type="button">닫기</button>
      </div>
    </div>
    <script type="module" src="/src/scene/main.ts"></script>
  </body>
</html>
