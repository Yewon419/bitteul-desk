<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1a2a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="빛뜰 데스크" />
    <title>빛뜰 데스크</title>
    <style>
      @font-face {
        font-family: 'Galmuri11';
        src: url('./fonts/galmuri/Galmuri11.woff2') format('woff2');
        font-weight: normal;
      }
      @font-face {
        font-family: 'Galmuri11';
        src: url('./fonts/galmuri/Galmuri11-Bold.woff2') format('woff2');
        font-weight: bold;
      }
      @font-face {
        font-family: 'Galmuri9';
        src: url('./fonts/galmuri/Galmuri9.woff2') format('woff2');
      }
      #toolbar { position: sticky; top: 0; z-index: 9; align-self: stretch; box-sizing: border-box; display: flex; flex-wrap: wrap; gap: 8px; padding: calc(12px + env(safe-area-inset-top)) 14px 12px; background: #0f1a2a; }
      #toolbar:not(:has(.tool-btn:not([hidden]))) { display: none; }
      .tool-btn { font-family: 'Galmuri11', sans-serif; font-size: 14px; padding: 8px 14px; background: #ffd166; color: #13293d; border: 3px solid #13293d; box-shadow: 3px 3px 0 #13293d; cursor: pointer; }
      .tool-btn[hidden] { display: none; }
      #scope { background: #ffffff; }
      #scope[data-on='true'] { background: #bfe0f5; }
      #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 12; max-width: min(640px, 92vw); padding: 12px 16px; font-family: 'Galmuri11', sans-serif; font-size: 14px; line-height: 1.6; color: #ffffff; background: #13293d; border: 3px solid #ffd166; }
      #toast[hidden] { display: none; }
      #toast a { color: #ffd166; font-weight: bold; }
      #toast button { font: inherit; font-size: 12px; margin-left: 6px; padding: 2px 8px; color: #13293d; background: #bfe0f5; border: 0; cursor: pointer; }
      html, body { margin: 0; }
      body { min-height: 100vh; overflow-x: hidden; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
      .sign-input { position: absolute; z-index: 11; box-sizing: border-box; font-family: 'Galmuri11', sans-serif; font-size: 16px; font-weight: bold; text-align: center; color: #13293d; background: #ffffff; border: 3px solid #ffd166; outline: none; }
      canvas { image-rendering: pixelated; display: block; touch-action: pan-y; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="hire" class="tool-btn" type="button" hidden>+ 새 직원</button>
      <button id="scope" class="tool-btn" type="button" hidden title="다른 폴더에서 연 Claude Code 세션도 사무실에 불러올지 정해요">이 폴더만 보는 중</button>
    </div>
    <canvas id="scene"></canvas>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/scene/main.ts"></script>
  </body>
</html>
