<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#172231" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="./scene/app-icon.png" />
    <link rel="icon" type="image/png" href="./scene/app-icon.png" />
    <title>빛뜰 데스크</title>
    <style>
      :root {
        --bg: #0f1722;
        --surface: #172231;
        --line: #26364a;
        --text: #e6edf3;
        --dim: #8ea3ba;
        --user: #ffd166;
        --accent: #2b86c5;
        --accent-strong: #5fe3ff;
        --warn: #ffd166;
        --danger: #ff8a7a;
        --sans: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        --code: 'Cascadia Mono', Consolas, 'D2Coding', 'SF Mono', monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
      body { display: flex; flex-direction: column; }
      header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
      h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #status { font-size: 12px; color: var(--dim); padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px; white-space: nowrap; }
      #status[data-state='작업 중'] { color: var(--accent-strong); border-color: var(--accent); }
      #status[data-state='승인 대기'] { color: var(--warn); border-color: var(--warn); }
      #log { flex: 1; overflow-y: auto; padding: 18px 22px 8px; }
      .msg { margin: 0 0 18px; }
      .msg-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
      .msg-who { font-size: 12px; font-weight: 600; color: var(--dim); }
      .msg-user .msg-who { color: var(--user); }
      .msg-time { font-size: 11px; color: var(--dim); opacity: 0.7; }
      .msg-body { font-size: 14.5px; line-height: 1.7; word-break: break-word; }
      .msg-user .msg-body { white-space: pre-wrap; padding-left: 12px; border-left: 2px solid var(--user); }
      .msg-tool { display: flex; gap: 8px; margin: -8px 0 12px; font-family: var(--code); font-size: 12px; color: var(--dim); }
      .tool-dot { color: var(--accent); }
      .tool-text { word-break: break-all; }
      .tools { margin: -8px 0 12px; font-family: var(--code); font-size: 12px; color: var(--dim); }
      .tools summary { cursor: pointer; list-style: none; display: flex; gap: 8px; }
      .tools summary::-webkit-details-marker { display: none; }
      .tools summary::before { content: '▸'; color: var(--accent); }
      .tools[open] summary::before { content: '▾'; }
      .tools-count { color: var(--text); white-space: nowrap; }
      .tools-last { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .tools .msg-tool { margin: 4px 0 0 16px; }
      .msg-body p { margin: 0 0 10px; }
      .msg-body p:last-child { margin-bottom: 0; }
      .msg-body a { color: var(--accent-strong); }
      .msg-body code { font-family: var(--code); font-size: 0.88em; background: #0b121b; padding: 1px 5px; border-radius: 4px; }
      .msg-body pre { background: #0b121b; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
      .msg-body pre code { background: none; padding: 0; }
      .msg-body table { border-collapse: collapse; margin: 8px 0; font-size: 13.5px; }
      .msg-body th, .msg-body td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
      .msg-body th { background: var(--surface); }
      .msg-body ul, .msg-body ol { margin: 4px 0 10px; padding-left: 22px; }
      .msg-body li { margin: 2px 0; }
      .msg-body h1, .msg-body h2, .msg-body h3 { font-size: 15px; margin: 14px 0 6px; }
      .msg-body blockquote { margin: 6px 0; padding-left: 12px; border-left: 2px solid var(--line); color: var(--dim); }
      #asks { padding: 0 22px; }
      #asks:empty { display: none; }
      .ask { border: 1px solid var(--warn); border-radius: 6px; background: #2a2412; padding: 10px 12px; margin: 0 0 12px; }
      .ask-title { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--warn); }
      .ask-text { margin: 0 0 10px; font-family: var(--code); font-size: 12px; white-space: pre-wrap; word-break: break-all; }
      .ask-actions { display: flex; gap: 8px; }
      .question { margin: 0 0 12px; }
      .q-chip { display: inline-block; margin-bottom: 4px; padding: 1px 6px; font-size: 11px; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; }
      .q-text { margin: 0 0 8px; font-size: 14px; line-height: 1.5; }
      .q-options { display: flex; flex-direction: column; gap: 6px; }
      .q-option { display: grid; grid-template-columns: 22px 1fr; column-gap: 8px; align-items: baseline; width: 100%; text-align: left; font: inherit; padding: 8px 10px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
      .q-option[aria-pressed='true'] { border-color: var(--accent-strong); background: #10283b; }
      .q-num { font-family: var(--code); font-size: 12px; color: var(--accent-strong); }
      .q-label { font-size: 14px; }
      .q-desc { grid-column: 2; font-size: 12px; color: var(--dim); }
      .q-other { width: 100%; margin-top: 6px; font: inherit; font-size: 14px; padding: 7px 10px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
      .q-hint { margin: 0 0 8px; font-size: 11px; color: var(--dim); }
      #stop { border-color: var(--danger); color: var(--danger); }
      #controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 6px 18px; font-size: 12px; color: var(--dim); border-bottom: 1px solid var(--line); background: var(--surface); }
      #controls[hidden] { display: none; }
      #controls label { display: flex; gap: 6px; align-items: center; }
      #controls select { font: inherit; font-size: 12px; padding: 3px 6px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 4px; }
      #picker:empty { display: none; }
      #working { display: flex; gap: 8px; align-items: baseline; padding: 4px 22px 10px; font-size: 13px; color: var(--accent-strong); }
      #working[hidden] { display: none; }
      .wk-spin { display: inline-block; flex: none; width: 8px; height: 8px; align-self: center; background: var(--accent-strong); animation: wk-turn 1.2s steps(4) infinite; }
      @keyframes wk-turn { 0% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(90deg) scale(0.6); } 100% { transform: rotate(180deg) scale(1); } }
      @media (prefers-reduced-motion: reduce) { .wk-spin { animation: none; } }
      #attach { flex: none; }
      #attachments { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; padding: 0; list-style: none; }
      #attachments:empty { display: none; }
      #attachments li { display: flex; gap: 6px; align-items: center; max-width: 100%; padding: 4px 6px 4px 10px; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
      .att-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px; }
      .att-size { color: var(--dim); }
      .att-remove { font: inherit; padding: 0 6px; color: var(--dim); background: none; border: 0; cursor: pointer; }
      body.dropping footer { outline: 2px dashed var(--accent-strong); outline-offset: -6px; }
      .drop-hint { display: none; margin: 0 0 8px; font-size: 13px; color: var(--accent-strong); }
      body.dropping .drop-hint { display: block; }
      .wk-meta { color: var(--dim); }
      #picker { padding: 0 22px; }
      .picker-card { border: 1px solid var(--accent); border-radius: 6px; background: #0f2233; padding: 10px 12px; margin: 0 0 12px; }
      #suggest { list-style: none; margin: 0 0 8px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); max-height: 40vh; overflow-y: auto; }
      #suggest[hidden] { display: none; }
      #suggest li { display: flex; gap: 10px; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 13px; }
      #suggest li[aria-selected='true'] { background: #10283b; }
      .sg-name { font-family: var(--code); color: var(--accent-strong); white-space: nowrap; }
      .sg-desc { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #stop[hidden] { display: none; }
      footer { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 18px 14px; }
      #note { margin: 0 0 8px; font-size: 12px; color: var(--dim); }
      #note:empty { display: none; }
      #error { margin: 6px 0 0; font-size: 12px; color: var(--danger); }
      #error:empty { display: none; }
      .composer { display: flex; gap: 10px; align-items: flex-end; }
      #input { flex: 1; min-height: 44px; max-height: 40vh; resize: vertical; font: inherit; font-size: 14px; line-height: 1.5; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
      #input:focus { outline: none; border-color: var(--accent); }
      .btn { font: inherit; font-size: 13px; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
      .btn-primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
      .btn:disabled, #input:disabled { opacity: 0.45; cursor: not-allowed; }
      .hint { margin: 6px 0 0; font-size: 11px; color: var(--dim); }
      #dismiss { flex: none; padding: 5px 10px; font-size: 12px; }
      #dismiss[data-confirm='1'] { color: var(--warn); border-color: var(--warn); }
      #dismiss[hidden] { display: none; }
      .back { display: none; flex: none; align-items: center; min-height: 36px; padding: 0 10px; font-size: 14px; color: var(--text); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); }
      @media (max-width: 900px), (pointer: coarse) {
        html, body { height: 100dvh; }
        .back { display: inline-flex; }
        header { gap: 10px; padding: calc(10px + env(safe-area-inset-top)) 12px 10px; }
        #status { font-size: 11px; padding: 3px 6px; }
        #log { padding: 14px 14px 8px; }
        #asks { padding: 0 12px; }
        footer { padding: 8px 12px calc(10px + env(safe-area-inset-bottom)); }
        #input { min-height: 48px; font-size: 16px; }
        .btn { min-height: 44px; padding: 10px 16px; font-size: 15px; }
        .ask-actions .btn { flex: 1; }
        .msg-body { font-size: 15px; }
      }
      @media (pointer: coarse) {
        .hint { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <a id="back" class="back" href="./scene.html">← 사무실</a>
      <h1 id="title">불러오는 중…</h1>
      <span id="status"></span>
      <button id="dismiss" class="btn" type="button" hidden>퇴근</button>
    </header>
    <div id="controls" hidden>
      <label>모드 <select id="mode"></select></label>
      <label>모델 <select id="model"></select></label>
    </div>
    <div id="log" role="log" aria-live="polite"></div>
    <div id="working" role="status" hidden><span class="wk-spin" aria-hidden="true"></span><span class="wk-text"></span><span class="wk-meta"></span></div>
    <div id="picker"></div>
    <div id="asks"></div>
    <footer>
      <p id="note"></p>
      <ul id="suggest" role="listbox" hidden></ul>
      <p class="drop-hint">여기에 놓으면 첨부돼요</p>
      <ul id="attachments"></ul>
      <div class="composer">
        <button id="attach" class="btn" type="button" title="파일 첨부 (끌어다 놓거나 붙여넣어도 돼요)">첨부</button>
        <input id="file-input" type="file" multiple hidden />
        <textarea id="input" rows="2" placeholder="직원에게 할 말"></textarea>
        <button id="stop" class="btn" type="button" hidden title="지금 하는 일을 멈춰요 (Esc)">중단</button>
        <button id="send" class="btn btn-primary" type="button">보내기</button>
      </div>
      <p class="hint">Enter 보내기 · Shift+Enter 줄바꿈</p>
      <p id="error"></p>
    </footer>
    <script type="module" src="/src/chat/main.ts"></script>
  </body>
</html>
