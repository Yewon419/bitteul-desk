<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>빛뜰 컴퍼니</title>
    <style>
      :root {
        --bg: #0f1722;
        --surface: #172231;
        --line: #26364a;
        --text: #e6edf3;
        --dim: #8ea3ba;
        --user: #ffd166;
        --accent: #2b86c5;
        --accent-strong: #5fe3ff;
        --warn: #ffd166;
        --danger: #ff8a7a;
        --sans: system-ui, -apple-system, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
        --code: 'Cascadia Mono', Consolas, 'D2Coding', 'SF Mono', monospace;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); }
      body { display: flex; flex-direction: column; }
      header { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); background: var(--surface); }
      h1 { flex: 1; margin: 0; font-size: 15px; font-weight: 600; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #status { font-size: 12px; color: var(--dim); padding: 3px 8px; border: 1px solid var(--line); border-radius: 4px; white-space: nowrap; }
      #status[data-state='작업 중'] { color: var(--accent-strong); border-color: var(--accent); }
      #status[data-state='승인 대기'] { color: var(--warn); border-color: var(--warn); }
      #log { flex: 1; overflow-y: auto; padding: 18px 22px 8px; }
      .msg { margin: 0 0 18px; }
      .msg-head { display: flex; gap: 8px; align-items: baseline; margin-bottom: 4px; }
      .msg-who { font-size: 12px; font-weight: 600; color: var(--dim); }
      .msg-user .msg-who { color: var(--user); }
      .msg-time { font-size: 11px; color: var(--dim); opacity: 0.7; }
      .msg-body { font-size: 14.5px; line-height: 1.7; word-break: break-word; }
      .msg-user .msg-body { white-space: pre-wrap; padding-left: 12px; border-left: 2px solid var(--user); }
      .msg-tool { display: flex; gap: 8px; margin: -8px 0 12px; font-family: var(--code); font-size: 12px; color: var(--dim); }
      .tool-dot { color: var(--accent); }
      .tool-text { word-break: break-all; }
      .msg-body p { margin: 0 0 10px; }
      .msg-body p:last-child { margin-bottom: 0; }
      .msg-body a { color: var(--accent-strong); }
      .msg-body code { font-family: var(--code); font-size: 0.88em; background: #0b121b; padding: 1px 5px; border-radius: 4px; }
      .msg-body pre { background: #0b121b; border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; }
      .msg-body pre code { background: none; padding: 0; }
      .msg-body table { border-collapse: collapse; margin: 8px 0; font-size: 13.5px; }
      .msg-body th, .msg-body td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; vertical-align: top; }
      .msg-body th { background: var(--surface); }
      .msg-body ul, .msg-body ol { margin: 4px 0 10px; padding-left: 22px; }
      .msg-body li { margin: 2px 0; }
      .msg-body h1, .msg-body h2, .msg-body h3 { font-size: 15px; margin: 14px 0 6px; }
      .msg-body blockquote { margin: 6px 0; padding-left: 12px; border-left: 2px solid var(--line); color: var(--dim); }
      #asks { padding: 0 22px; }
      #asks:empty { display: none; }
      .ask { border: 1px solid var(--warn); border-radius: 6px; background: #2a2412; padding: 10px 12px; margin: 0 0 12px; }
      .ask-title { margin: 0 0 6px; font-size: 13px; font-weight: 600; color: var(--warn); }
      .ask-text { margin: 0 0 10px; font-family: var(--code); font-size: 12px; white-space: pre-wrap; word-break: break-all; }
      .ask-actions { display: flex; gap: 8px; }
      footer { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 18px 14px; }
      #note { margin: 0 0 8px; font-size: 12px; color: var(--dim); }
      #note:empty { display: none; }
      #error { margin: 6px 0 0; font-size: 12px; color: var(--danger); }
      #error:empty { display: none; }
      .composer { display: flex; gap: 10px; align-items: flex-end; }
      #input { flex: 1; min-height: 44px; max-height: 40vh; resize: vertical; font: inherit; font-size: 14px; line-height: 1.5; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; }
      #input:focus { outline: none; border-color: var(--accent); }
      .btn { font: inherit; font-size: 13px; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer; }
      .btn-primary { background: var(--accent); border-color: var(--accent); color: #ffffff; }
      .btn:disabled, #input:disabled { opacity: 0.45; cursor: not-allowed; }
      .hint { margin: 6px 0 0; font-size: 11px; color: var(--dim); }
    </style>
  </head>
  <body>
    <header>
      <h1 id="title">불러오는 중…</h1>
      <span id="status"></span>
    </header>
    <div id="log" role="log" aria-live="polite"></div>
    <div id="asks"></div>
    <footer>
      <p id="note"></p>
      <div class="composer">
        <textarea id="input" rows="2" placeholder="직원에게 할 말"></textarea>
        <button id="send" class="btn btn-primary" type="button">보내기</button>
      </div>
      <p class="hint">Enter 보내기 · Shift+Enter 줄바꿈</p>
      <p id="error"></p>
    </footer>
    <script type="module" src="/src/chat/main.ts"></script>
  </body>
</html>
